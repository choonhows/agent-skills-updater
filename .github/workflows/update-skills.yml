name: Update skills

# Weekly check of every upstream in sources/tracked.json. Changes arrive as one
# pull request on the auto/skill-updates branch; nothing reaches main unreviewed.
on:
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-skills
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh skills from upstream
        id: refresh
        run: |
          python3 -I tools/update_skills.py --summary "$RUNNER_TEMP/summary.md" | tee "$RUNNER_TEMP/out.txt"
          grep -q '^changed=true' "$RUNNER_TEMP/out.txt" && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the pull request
        if: steps.refresh.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/skill-updates
          delete-branch: true
          title: "Weekly skill updates"
          commit-message: "chore: refresh skills from upstream"
          body-path: ${{ runner.temp }}/summary.md
          labels: skill-updates
          add-paths: |
            skills/**
            sources/tracked.json
